server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (optional)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
